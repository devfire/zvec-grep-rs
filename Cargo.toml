[workspace]
resolver = "3"
members = ["crates/zg-core", "crates/zg-server", "crates/zg"]

[workspace.package]
version = "0.2.1"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/zvec-ai/zvec-grep"
# Bumped 1.85 -> 1.88 by phases C/D: `ort =2.0.0-rc.13` declares
# `rust-version = "1.88"` (verified via `cargo info`), and the plan
# mandates bumping deliberately rather than holding a false MSRV.
# `llama-cpp-2` declares no `rust-version`; its toolchain floor is
# unverified (it needs a C++ toolchain regardless) and CI builds it on
# stable.
rust-version = "1.88"

[workspace.dependencies]
zg-core = { path = "crates/zg-core" }
zg-server = { path = "crates/zg-server" }

thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
regex = "1"
rayon = "1"
crossbeam-channel = "0.5"
walkdir = "2"
ignore = "0.4"
globset = "0.4"
grep-searcher = "0.1"
grep-matcher = "0.1"
grep-regex = "0.1"
zvec-rust = "0.7"
tokenizers = { version = "0.21", default-features = false, features = ["onig", "http"] }
safetensors = "0.6"
half = "2"
ureq = { version = "3", features = ["json"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "blocking", "stream"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "signal", "net", "io-util", "process", "fs"] }
tokio-util = "0.7"
notify = "8"
axum = { version = "0.8", features = ["json"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors"] }
rmcp = { version = "0.6", features = ["server", "client", "transport-streamable-http-server", "transport-child-process", "transport-io", "auth"] }
bytes = "1"
http-body-util = "0.1" 
clap = { version = "4", features = ["derive", "string", "env"] }
clap_complete = "4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
tree-sitter = "0.25"
tree-sitter-c = "0.23"
tree-sitter-cpp = "0.23"
tree-sitter-go = "0.23"
tree-sitter-java = "0.23"
tree-sitter-javascript = "0.23"
tree-sitter-python = "0.23"
tree-sitter-rust = "0.23"
tree-sitter-typescript = "0.23"
pulldown-cmark = "0.13"
futures = "0.3"
async-trait = "0.1"
rand = "0.9"
hmac = "0.12"
subtle = "2"
base64 = "0.22"
url = "2"
tempfile = "3"
libc = "0.2"
rustix = { version = "1", features = ["process"] }
os_info = "3"
# Heavy local-inference backends (M7): exact pins. `ort` is pinned to the
# 2.x-rc line whose `Session::builder` / `inputs!` / `try_extract_tensor`
# API this workspace targets (the 1.x line differs); `llama-cpp-2` caret
# pins the 0.1 minor line. Both are `optional` and enabled via
# `zg-core`'s `onnx` / `llama` features so default builds stay hermetic.
ort = { version = "=2.0.0-rc.13" }
llama-cpp-2 = { version = "0.1.156", default-features = false }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

[profile.dist]
inherits = "release"
lto = "fat"
[workspace.lints.rust]
unsafe_code = "forbid"
# M8 tracks `missing_docs = "warn"` restoration with `cargo doc --no-deps`
# warning-free. Until then this stays `allow`: ~870 undocumented public
# items flood `cargo test`/`clippy` and hide real warnings. Enforce docs via
# `RUSTDOCFLAGS="-D missing-docs" cargo doc --workspace --no-deps` in CI.
missing_docs = "allow"
unused_qualifications = "warn"
[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
todo = "deny"
dbg_macro = "deny"
unwrap_used = "deny"
# Phase 0 lint firewall: `expect` in non-test code is a hidden panic.
# Test builds keep targeted `cfg(test)` allows at each crate root
# (template: `crates/zg/src/main.rs`) plus per-file allows in `tests/`.
expect_used = "deny"
# `panic!` in non-test code must go through typed errors (Phase 2). The
# three `redact_error_text` statics carry one targeted `#[allow]` +
# justification until then; test targets keep their own `cfg(test)` /
# file-level allows. (`unreachable!` sites verify clean under this lint.)
panic = "deny"
# `fallible_impl_from`, `unneeded_field_pattern`, and
# `fn_params_excessive_bools` are clean today: deny so no new violations land.
fallible_impl_from = "deny"
unneeded_field_pattern = "deny"
fn_params_excessive_bools = "deny"
# `indexing_slicing`, `wildcard_enum_match_arm`, and `must_use_candidate`
# were warn-level debt until Phases 4/5/7 cleared every site (clippy-cleanup
# commit); they stay `deny` so no new violations land.
indexing_slicing = "deny"
wildcard_enum_match_arm = "deny"
must_use_candidate = "deny"
# Docs + diagnostics: panic and error docs are mandatory after Phases 2-3
# cleared every site; large-`Err` diagnostics warn until their owning phase
# clears them.
missing_errors_doc = "deny"
missing_panics_doc = "deny"
result_large_err = "warn"
# `string_slice` stays at its default (allow): trial-enabling it as `warn`
# fires on ~45 pre-existing sites across 12 files (markdown, trace,
# install, glob, ...), far beyond the four R8 audited. Those need a
# dedicated audit pass first — a warn-gate with 45 known warnings trains
# reviewers to ignore warnings. `indexing_slicing` remains the deny-level
# firewall; audited `str` sites carry the ASCII-boundary invariant comment.
# The `zg` binary is a CLI: stdout/stderr output is its contract, so the
# binary crate allows these at its root (see `crates/zg/src/main.rs`;
# Cargo forbids `workspace = true` plus per-lint overrides in one manifest).
print_stdout = "warn"
print_stderr = "warn"
