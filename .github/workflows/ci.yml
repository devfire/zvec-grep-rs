name: ci

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # Warms the vector-parity gate (phases C/D): with the models cached,
      # `vector_parity` embeds and compares instead of skipping. The
      # default-feature run never downloads (compiled-out backends skip
      # before any IO); `--all-features` consumes the cache when warm and
      # skips with a printed reason when cold — never downloading inside
      # a test.
      - name: Cache embedding models
        uses: actions/cache@v4
        with:
          path: ~/.zvec-grep/models
          key: embedding-models-v1
      - run: cargo test --workspace
      - run: cargo test --workspace --all-features
      - run: cargo test --workspace --no-default-features

  clippy:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: cargo clippy --workspace --all-targets
      - run: cargo clippy --workspace --all-targets --all-features

  error-codes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Ban runtime-assembled error codes (M1)
        run: |
          test -z "$(grep -rn 'EngineErrorCode::new(&format!' crates/ || true)"
      - run: cargo test -p zg-core --test error_codes_golden

  doc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
