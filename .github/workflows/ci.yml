name: ci

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      # A flake on one OS must not cancel (and mask the result of) the other.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # --all-features builds ort-sys, whose build script downloads prebuilt
      # ONNX Runtime from cdn.pyke.io (see run 35162830575: transient runner
      # DNS failure). The pyke cache is content-addressed by dist hash, so a
      # warm cache skips the download entirely.
      - name: Cache ONNX Runtime (ort-sys)
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/ort.pyke.io
            ~/Library/Caches/ort.pyke.io
          key: ort-sys-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: ort-sys-${{ runner.os }}-
      # Warms the vector-parity gate (phases C/D): with the models cached,
      # `vector_parity` embeds and compares instead of skipping. The
      # default-feature run never downloads (compiled-out backends skip
      # before any IO); `--all-features` consumes the cache when warm and
      # skips with a printed reason when cold — never downloading inside
      # a test.
      - name: Cache embedding models
        uses: actions/cache@v4
        with:
          path: ~/.zvec-grep/models
          key: embedding-models-v1
      # service_facade is feature-gated (test-support): skipped here by design, covered by the --all-features run below.
      - run: cargo test --workspace --locked
      - run: cargo test --workspace --locked --all-features
      - run: cargo test --workspace --locked --no-default-features

  vector-parity-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # Same ORT cache as `test`: the gate builds `--all-features`.
      - name: Cache ONNX Runtime (ort-sys)
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/ort.pyke.io
            ~/Library/Caches/ort.pyke.io
          key: ort-sys-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: ort-sys-${{ runner.os }}-
      - name: Cache embedding models
        id: model-cache
        uses: actions/cache@v4
        with:
          path: ~/.zvec-grep/models
          key: embedding-models-v1
      # On a cold cache the gate would fail by design
      # (`ZVEC_REQUIRE_MODELS=1` turns skips into hard failures), so
      # populate the cache first. Warm hits skip the download entirely.
      - name: Warm model cache (cache miss only)
        if: steps.model-cache.outputs.cache-hit != 'true'
        run: cargo run -p zg-core --locked --all-features --example warm_model_cache
      # Sign-off gate: fails on zero models checked — a cache miss without
      # the warm step above must never silently pass.
      - name: Vector parity gate (coverage required)
        run: cargo test -p zg-core --locked --all-features --test vector_parity
        env:
          ZVEC_REQUIRE_MODELS: 1

  clippy:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Cache ONNX Runtime (ort-sys)
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/ort.pyke.io
            ~/Library/Caches/ort.pyke.io
          key: ort-sys-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: ort-sys-${{ runner.os }}-
      - run: cargo clippy --workspace --all-targets --locked
      - run: cargo clippy --workspace --all-targets --locked --all-features

  error-codes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test -p zg-core --locked --test error_codes_golden

  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo fmt --all --check

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88
      - run: cargo check --workspace --locked

  doc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
