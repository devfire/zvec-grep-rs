[package]
name = "zg-core"
description = "zvec-grep engine: workspace scanning, extraction, embeddings, index storage, and hybrid retrieval"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
uuid.workspace = true
chrono.workspace = true
regex.workspace = true
rayon.workspace = true
walkdir.workspace = true
ignore.workspace = true
globset.workspace = true
grep-searcher.workspace = true
grep-matcher.workspace = true
grep-regex.workspace = true
zvec-rust.workspace = true
hmac.workspace = true
rand.workspace = true
tokenizers.workspace = true
safetensors.workspace = true
half.workspace = true
ureq.workspace = true
tree-sitter.workspace = true
tree-sitter-c.workspace = true
tree-sitter-cpp.workspace = true
tree-sitter-go.workspace = true
tree-sitter-java.workspace = true
tree-sitter-javascript.workspace = true
tree-sitter-python.workspace = true
tree-sitter-rust.workspace = true
tree-sitter-typescript.workspace = true
libc.workspace = true
url.workspace = true
# Feature-gated heavy backends (M7): optional workspace deps, enabled via
# `dep:` below so default builds need no C++ toolchain or ORT download.
ort = { workspace = true, optional = true }
llama-cpp-2 = { workspace = true, optional = true }

[dev-dependencies]
tempfile.workspace = true
# The vector-parity gate parses committed TS golden JSON.
serde_json.workspace = true

[features]
default = []
test-support = []
# Heavy local-inference backends (M7): off by default so `cargo install zg`
# needs no C++ toolchain and `cargo test -p zg-core` stays hermetic.
# Each feature enables its pinned optional dep plus the matching
# `#[cfg(feature)]`-gated backend module and factory arm; compiled out,
# the factory answers `ModelError::BackendUnavailable` for those entries.
onnx = ["dep:ort"]
llama = ["dep:llama-cpp-2"]
[lints]
workspace = true
